plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace = "com.salsacare"
    // Google Play mensyaratkan target Android 16 (API 36). Flutter 3.32.2 masih
    // default ke 35, jadi compileSdk/targetSdk di-override manual ke 36 di sini.
    // Setelah upgrade Flutter ke versi yang default 36, override ini bisa dihapus.
    compileSdk = 36
    // Dipatok manual (bukan flutter.ndkVersion yang masih 26.3.11579264) karena
    // 18 plugin — firebase_*, mobile_scanner, geolocator_android, dll —
    // mendeklarasikan butuh NDK 27.0.12077973. NDK backward compatible, jadi
    // memakai versi tertinggi yang diminta adalah cara yang disarankan Flutter.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.salsacare"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
//        minSdk = flutter.minSdkVersion
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }

//        debug {
//            // TODO: Add your own signing config for the debug build.
//            // Signing with the debug keys for now, so `flutter run --debug` works.
//            signingConfig = signingConfigs.debug
//        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

