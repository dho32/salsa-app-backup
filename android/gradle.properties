# Heap sengaja 2G (bukan 4G): mesin dev sering ketat RAM sehingga 4G bikin build
# gagal OOM di tahap packaging (:app:packageRelease). 2G terbukti cukup untuk
# project ini (build ~2 menit). Naikkan lagi hanya jika build di mesin ber-RAM lega.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Kotlin 2.x menjalankan compiler di daemon JVM TERPISAH dari Gradle daemon.
# Tanpa batas, daemon itu minta ~2-4G sendiri sehingga commit charge mesin ini
# mentok → daemon Gradle mati "disappeared unexpectedly" (OOM native).
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
# Batasi worker paralel supaya tidak ada beberapa JVM worker sekaligus.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# AGP 8.6.1 baru "tested up to" compileSdk 35. Kita sengaja compile ke 36 (Android 16)
# untuk memenuhi syarat Google Play. Flag ini membungkam warning "unsupported compileSdk".
android.suppressUnsupportedCompileSdk=36
